# Локальная разработка: docker compose up -d db
# Сервер целиком:      docker compose --profile prod up -d --build

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-gigo}:${POSTGRES_PASSWORD:-gigo}@db:5432/${POSTGRES_DB:-gigo}
  depends_on:
    db:
      condition: service_healthy
  logging:
    options: {max-size: "10m", max-file: "5"}
  profiles: ["prod"]

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gigo}
      POSTGRES_USER: ${POSTGRES_USER:-gigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # API для Mini App; при старте сам применяет миграции базы
  api:
    <<: *backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gigo}:${POSTGRES_PASSWORD:-gigo}@db:5432/${POSTGRES_DB:-gigo}
      STATIC_DIR: /nonexistent   # статику раздаёт Caddy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Бот: кнопка Mini App, события по откликам и новые заявки по подпискам
  bot:
    <<: *backend
    command: python -m gigo.bot
    depends_on:
      api:
        condition: service_started

  # Mini App + HTTPS
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_YANDEX_MAPS_KEY: ${VITE_YANDEX_MAPS_KEY:-}
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-}
        VITE_MINIAPP_NAME: ${VITE_MINIAPP_NAME:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data
    depends_on: [api]
    profiles: ["prod"]

volumes:
  pgdata:
  caddy_data:
